<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student | StudentTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="dashboard-body">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                🎓
            </div>

            <div>
                <h2>StudentTrack</h2>
                <span>Performance System</span>
            </div>

        </div>


        <nav class="sidebar-menu">

            <a href="/dashboard" class="menu-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="/students" class="menu-item active">
                <span>👨‍🎓</span>
                Students
            </a>

            <a href="/performance" class="menu-item">
    <span>📝</span>
    Performance
</a>

            <a href="#" class="menu-item">
                <span>📅</span>
                Attendance
            </a>

            <a href="#" class="menu-item">
                <span>📄</span>
                Reports
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="/" class="menu-item logout">
                <span>🚪</span>
                Logout
            </a>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Add Student</h1>

                <p>
                    Add a new student to the system
                </p>

            </div>


            <div class="profile">

                <div class="notification">
                    🔔
                </div>

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>

            </div>

        </header>


        <!-- FORM CARD -->

        <div class="form-card">

            <div class="form-header">

                <div class="form-icon">
                    👨‍🎓
                </div>

                <div>

                    <h2>Student Information</h2>

                    <p>
                        Enter the student's details below.
                    </p>

                </div>

            </div>


            <form method="POST"
                  action="/add-student">


                <!-- NAME + STUDENT ID -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Student Name *
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Student ID *
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            placeholder="Example: STU001"
                            required
                        >

                    </div>

                </div>


                <!-- DEPARTMENT + YEAR -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Department *
                        </label>

                        <select
                            name="department"
                            required
                        >

                            <option value="">
                                Select department
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Artificial Intelligence">
                                Artificial Intelligence
                            </option>

                            <option value="Data Science">
                                Data Science
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Cyber Technology">
                                Cyber Technology
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Year *
                        </label>

                        <select
                            name="year"
                            required
                        >

                            <option value="">
                                Select year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="4th Year">
                                4th Year
                            </option>

                        </select>

                    </div>

                </div>


                <!-- EMAIL + PHONE -->

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="student@example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                        >

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="/students"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-button"
                    >
                        💾 Save Student
                    </button>

                </div>


            </form>

        </div>

    </main>

</body>

</html>
